services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beautedor
      POSTGRES_PASSWORD: beautedor
      POSTGRES_DB: beautedor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautedor"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://beautedor:beautedor@db:5432/beautedor
      JWT_SECRET: ${JWT_SECRET:-}            # obligatoire pour le service app (vérifié au démarrage)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@beautedor.sn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/server/uploads

volumes:
  pgdata:
  uploads:
